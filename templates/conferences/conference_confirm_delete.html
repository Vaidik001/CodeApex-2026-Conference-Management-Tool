{% extends 'base.html' %}
{% block title %}Delete Conference | CMT{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 border-danger">
                <div class="card-body p-4 p-md-5 text-center">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
                    <h3 class="fw-bold mt-3">Delete Conference?</h3>
                    <p class="text-muted">Are you sure you want to delete <strong>{{ conference.title }}</strong>? This action cannot be undone.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
                        <a href="{% url 'conference_detail' pk=conference.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
